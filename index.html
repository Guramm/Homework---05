<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Footer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <footer class="bg-black text-white">
      <div class="mx-auto max-w-[1680px] px-6 md:px-20 pt-24 pb-10">
        <!-- "lg" only applies style when screen is wider than 1024px-->
        <div
          class="flex flex-col gap-10 lg:flex-row lg:items-center lg:justify-between"
        >
          <h2
            class="max-w-3xl text-5xl md:text-7xl font-bold uppercase leading-tight"
          >
            Design news to your inbox
          </h2>
          <form class="flex gap-3">
            <input
              type="email"
              placeholder="Email"
              class="h-12 w-full lg:w-80 bg-white px-4 text-black"
            />
            <button
              class="h-12 bg-white px-6 text-sm font-medium uppercase text-black"
            >
              Sign up
            </button>
          </form>
        </div>
        <div class="mt-24 grid gap-10 md:grid-cols-4 md:gap-16">
          <a href="#" class="text-2xl font-bold uppercase">Fyrre Magazine</a>
          <ul class="space-y-4 border-t border-neutral-800 pt-7 font-light">
            <li><a href="#">Art</a></li>
            <li><a href="#">Design</a></li>
            <li><a href="#">Architecture</a></li>
          </ul>
          <ul class="space-y-4 border-t border-neutral-800 pt-7 font-light">
            <li><a href="#">Magazine</a></li>
            <li><a href="#">Podcast</a></li>
            <li><a href="#">Authors</a></li>
          </ul>
          <ul class="space-y-4 border-t border-neutral-800 pt-7 font-light">
            <li><a href="#">Styleguide</a></li>
            <li><a href="#">Licensing</a></li>
            <li><a href="#">Changelog</a></li>
          </ul>
        </div>
        <div class="mt-24 flex items-center justify-between text-sm font-light">
          <p>© Made by Pawel Gola - Powered by Webflow</p>
          <div class="flex gap-4 text-lg">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-solid fa-rss"></i></a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
